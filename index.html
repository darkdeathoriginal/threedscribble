<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Scribble Art</title>
  </head>
  <body>
    <div id="boot-error" role="alert"></div>
    <div id="root"></div>
    <script>
      const bootError = document.getElementById('boot-error');
      const showBootError = (message) => {
        bootError.textContent = message;
        bootError.style.display = 'block';
      };
      window.addEventListener('error', (event) => showBootError(event.message || 'The app could not start.'));
      window.addEventListener('unhandledrejection', (event) =>
        showBootError(event.reason?.message || 'The app could not start.'),
      );
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
